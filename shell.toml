# Manifiesto de velvet: lo que necesita para funcionar.
# duran instala los paquetes; hooks/install.sh hace el resto.

[shell]
name = "velvet"
description = "Shell estilo Persona (P3 · P4 · P5) para Hyprland con modos general / dev / art / game"
version = "0.2.0"
license = "GPL-3.0-or-later"
engine = "quickshell"
start = "qs -c velvet -d"
stop = "qs -c velvet kill"

[packages]
repo = [
  "quickshell",
  "grim", "swappy", "wf-recorder", "wl-clipboard", "imagemagick",   # capturas y grabación
  "brightnessctl", "ddcutil",                                        # brillo
  "power-profiles-daemon", "gamemode",                               # energía por modo
  "hypridle", "hyprsunset",                                          # bloqueo y luz nocturna por modo
  "polkit-gnome", "gnome-keyring",                                   # autenticación y llavero (config de inicio)
  "libnotify", "curl", "libpulse", "procps-ng", "bash",              # notificaciones, tiempo, audio, procesos, scripts
  "cliphist", "wtype", "hyprpicker", "foot", "nwg-displays",                        # portapapeles, emojis, color, terminal
  "ttf-jetbrains-mono", "noto-fonts-emoji",
]
aur = []

[fonts]
families = ["Bebas Neue", "Montserrat", "JetBrains Mono"]
# Bebas Neue y Montserrat van dentro de velvet (FontLoader en shell.qml).
# JetBrains Mono viene del paquete ttf-jetbrains-mono.
files = ["assets/fonts/BebasNeue-Regular.ttf", "assets/fonts/Montserrat-*.ttf"]

[system]
modules = ["i2c-dev"]
groups = ["i2c"]
services_enable = ["power-profiles-daemon"]
user_services_enable = ["hypridle"]
services_disable = ["tlp"]
user_services_disable = ["hyprpaper"]

[dirs]
create = ["~/Pictures/Wallpapers", "~/Pictures/Screenshots", "~/Videos/Recordings"]
state = "~/.local/state/velvet"
wallpapers = "~/Pictures/Wallpapers"   # wallpaper-<red|blue|yellow>-<n>.<jpg|jpeg|png>

# Lo que velvet escribe en state (no va a dotfiles)
[state]
mode = "mode"                      # modo activo: general | dev | art | game (también lo lee Hyprland)
settings = "settings.json"         # Ajustes (globales + por modo)
launcher = "launcher.json"         # rango de uso del lanzador
foot = "foot-colors.ini"           # cursor + selección del modo (lo genera scripts/term.sh)
fastfetch = "fastfetch.jsonc"      # fastfetch con el trío del modo (scripts/term.sh)

[modes]
list = ["general", "dev", "art", "game"]
palettes = "config/Theme.qml"                 # trío de cada modo en QML
apply = "services/ModeApply.qml"              # energía, hypridle, DND, luz nocturna, gamemode, apps, terminal
scripts = ["scripts/idle.sh", "scripts/term.sh"]

[pam]
# El lockscreen usa su propio archivo PAM (relativo a config_dir)
config = "lock/pam/password.conf"

# Comandos IPC que usan los atajos de Hyprland
[ipc]
launcher      = "qs -c velvet ipc call launcher toggle"
lock          = "qs -c velvet ipc call lock lock"
wallpaper     = "qs -c velvet ipc call wallpaper toggle"
settings      = "qs -c velvet ipc call settings toggle"
mode          = "qs -c velvet ipc call mode toggle"
mode_set      = "qs -c velvet ipc call mode set <general|dev|art|game>"
app           = "qs -c velvet ipc call app launch <terminal|browser|editor|files|audio>"
session       = "qs -c velvet ipc call session open"
notifs_clear  = "qs -c velvet ipc call notifs clear"
volume_up     = "qs -c velvet ipc call osd volumeUp"
volume_down   = "qs -c velvet ipc call osd volumeDown"
volume_mute   = "qs -c velvet ipc call osd mute"
bright_up     = "qs -c velvet ipc call osd brightnessUp"
bright_down   = "qs -c velvet ipc call osd brightnessDown"
media_toggle  = "qs -c velvet ipc call media toggle"
media_next    = "qs -c velvet ipc call media next"
media_prev    = "qs -c velvet ipc call media previous"
media_stop    = "qs -c velvet ipc call media stop"
shot_screen   = "qs -c velvet ipc call capture screen"
shot_region   = "qs -c velvet ipc call capture region"
shot_window   = "qs -c velvet ipc call capture window"
rec_region    = "qs -c velvet ipc call capture record"
rec_screen    = "qs -c velvet ipc call capture recordScreen"
rec_sound     = "qs -c velvet ipc call capture recordSound"
clipboard     = "qs -c velvet ipc call clipboard toggle"
emoji         = "qs -c velvet ipc call emoji toggle"

[autostart]
# Procesos de fondo que velvet necesita (hoy los lanza execs.lua de Hyprland)
commands = ["wl-paste --type text --watch cliphist store", "wl-paste --type image --watch cliphist store"]

[assets]
emoji = "assets/emoji.json"   # emojibase-data 15.3.2 (es), sin tonos de piel

[hyprland]
config = "hypr/shell.lua"   # duran la enlaza en ~/.config/hypr/shell.lua (colores por modo, huecos, efectos, VRR, layer rules)
generated = ["hypridle.conf"]                        # lo reescribe scripts/idle.sh
extra = ["hyprsunset.conf"]                          # perfiles día/noche de la luz nocturna
keybinds = { launcher = "SUPER", settings = "SUPER + I", mode = "SUPER + TAB" }

# Cambios que velvet necesita en otras configs de dotfiles
[integrations]
foot = "include=~/.local/state/velvet/foot-colors.ini  (primera línea de foot.ini)"
fish = "fish_greeting: fastfetch -c ~/.local/state/velvet/fastfetch.jsonc si existe"

[conflicts]
shells = ["caelestia"]
processes = ["hyprpaper"]

[hooks]
install = "hooks/install.sh"
uninstall = "hooks/uninstall.sh"